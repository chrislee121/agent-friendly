name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/*.py
      - run: python scripts/selftest.py
      - run: python scripts/lint_tools.py examples/tools.good.json
